<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythili | Portfolio</title>
<style>
:root {
  --bg: #0f172a;
  --text: #fff;
  --accent: #00f5ff;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* Header */
header {
  position: fixed;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  backdrop-filter: blur(15px);
  z-index: 1000;
}
header h2 {
  margin: 0;
}
header nav a {
  margin-right: 20px;
  text-decoration: none;
  color: var(--text);
  transition: color 0.3s;
}
header nav a:hover {
  color: var(--accent);
}
#mode {
  cursor: pointer;
  background: none;
  border: none;
  font-size: 1.2rem;
  color: var(--text);
}

/* Sections */
.section {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transform: translateY(60px);
  transition: 0.8s;
  padding: 0 20px;
  text-align: center;
}

/* Gradient text */
.gradient {
  background: linear-gradient(90deg, #00f5ff, #ff00ff);
  -webkit-background-clip: text;
  color: transparent;
}

/* Cards */
.cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 20px;
}
.card {
  padding: 20px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  width: 250px;
  transition: 0.4s;
  cursor: pointer;
}
.card:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px var(--accent);
}
.card h3 {
  margin: 0 0 10px 0;
}
.card p {
  margin: 0;
}

/* Cursor */
.cursor {
  width: 20px;
  height: 20px;
  background: var(--accent);
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(10px);
  mix-blend-mode: difference;
}

/* Dark/Light mode */
.light {
  --bg: #fff;
  --text: #000;
}

/* Canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* Typing animation */
#typing {
  font-size: 1.5rem;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="cursor"></div>

<header>
  <h2>Mythili</h2>
  <nav>
    <a href="#home">Home</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
    <button id="mode">🌙</button>
  </nav>
</header>

<section id="home" class="section">
  <h1>Hi, I'm <span class="gradient">Mythili</span></h1>
  <h3 id="typing"></h3>
</section>

<section id="projects" class="section">
  <h2>Projects</h2>
  <div class="cards" id="cards"></div>
</section>

<section id="contact" class="section">
  <h2>Contact</h2>
  <p>Email: <a href="mailto:mythilibcsit16@gmail.com" style="color:var(--accent);">mythilibcsit16@gmail.com</a></p>
</section>

<canvas id="bg"></canvas>

<script>
// Typing Animation
const words = ["Frontend Developer", "Creative Designer", "JavaScript Expert"];
let i = 0, j = 0, deleting = false;

function type() {
  let word = words[i];
  document.getElementById("typing").innerText = word.substring(0, j);
  
  if (!deleting && j++ === word.length) {
    deleting = true;
    setTimeout(type, 1000);
    return;
  }
  
  if (deleting && j-- === 0) {
    deleting = false;
    i = (i + 1) % words.length;
  }
  
  setTimeout(type, deleting ? 50 : 100);
}
type();

// Custom Cursor
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

// Scroll animations
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = 1;
      entry.target.style.transform = "translateY(0)";
    }
  });
});
document.querySelectorAll(".section").forEach(section => observer.observe(section));

// Projects Data
const projects = [
  { name: "AI Tool", desc: "Smart AI app" },
  { name: "Ecommerce", desc: "Full stack shop" },
  { name: "Dashboard", desc: "Analytics UI" },
  { name: "Portfolio Website", desc: "Personal portfolio" },
  { name: "Chat App", desc: "Real-time chat application" }
];

const cardsContainer = document.getElementById("cards");
projects.forEach(p => {
  let card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h3>${p.name}</h3><p>${p.desc}</p>`;
  cardsContainer.appendChild(card);
});

// Dark/Light Mode
const modeBtn = document.getElementById("mode");
modeBtn.onclick = () => {
  document.body.classList.toggle("light");
  modeBtn.textContent = document.body.classList.contains("light") ? "🌞" : "🌙";
};

// Canvas Particles
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = Array.from({length: 80}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  dx: (Math.random() - 0.5) * 1.5,
  dy: (Math.random() - 0.5) * 1.5
}));

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(0,245,255,0.8)";
  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;
    
    if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if(p.y < 0 || p.y > canvas.height) p.dy *= -1;
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// Resize canvas on window resize
window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
